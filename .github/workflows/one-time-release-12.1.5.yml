name: One-time scheduled release 12.1.5

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: one-time-release-12.1.5
  cancel-in-progress: false

jobs:
  create-release-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TARGET_TAG: v12.1.5
      TARGET_SHA: 4790a62a703cf4b456db93a482b10e28e5f0e543
      TARGET_DATE_UTC: "2026-05-07"
      TARGET_LOCAL_TIME: "2026-05-07 02:00 Europe/Berlin"
      WORKFLOW_FILE: .github/workflows/one-time-release-12.1.5.yml

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to run now
        id: window
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          now_date="$(date -u +%F)"
          if [ "$now_date" = "$TARGET_DATE_UTC" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping release scheduler. Expected UTC date $TARGET_DATE_UTC for $TARGET_LOCAL_TIME, got $now_date."
          fi

      - name: Create frozen release tag
        if: steps.window.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          if git rev-parse -q --verify "refs/tags/$TARGET_TAG" >/dev/null; then
            echo "Tag $TARGET_TAG already exists."
            exit 0
          fi
          git tag "$TARGET_TAG" "$TARGET_SHA"
          git push origin "$TARGET_TAG"

      - name: Remove one-time scheduler
        if: steps.window.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f "$WORKFLOW_FILE"
          git commit -m "Remove one-time scheduler for 12.1.5" || exit 0
          git push origin HEAD:main
