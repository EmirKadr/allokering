name: Merge community observations

on:
  push:
    branches:
      - data/community-observations
    paths:
      - 'LYX Mestergruppen/observations_*.csv.gz'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/community-observations
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pandas

      - name: Merge user observations into master file
        run: |
          python <<'PY'
          import glob, os, pandas as pd
          from pathlib import Path

          base_path = Path('LYX Mestergruppen/observations.csv.gz')
          cols = ['artikelnummer', 'pallid', 'antal']

          frames = []
          if base_path.exists() and base_path.stat().st_size > 0:
              frames.append(pd.read_csv(base_path, dtype=str))

          user_files = sorted(glob.glob('LYX Mestergruppen/observations_*.csv.gz'))
          for f in user_files:
              try:
                  df = pd.read_csv(f, dtype=str)
                  if all(c in df.columns for c in cols):
                      frames.append(df[cols])
              except Exception as e:
                  print(f'Skipping {f}: {e}')

          if not frames:
              print('No data to merge')
          else:
              merged = pd.concat(frames, ignore_index=True)
              before = len(merged)
              merged = merged.drop_duplicates(subset='pallid', keep='first')
              after = len(merged)
              base_path.parent.mkdir(parents=True, exist_ok=True)
              merged.to_csv(base_path, index=False, compression='gzip')
              print(f'Merged {len(user_files)} user files. Rows: {before} -> {after} after dedup.')

          for f in user_files:
              os.remove(f)
              print(f'Removed {f}')
          PY

      - name: Commit merged observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'LYX Mestergruppen/observations.csv.gz'
          git add -A 'LYX Mestergruppen/observations_*.csv.gz' || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Merge user observations into master observations.csv.gz"
            git push origin data/community-observations
          fi
