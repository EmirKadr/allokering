<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logga in - Stigamo</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20260318a">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("allok_theme") || "light";
        document.documentElement.setAttribute("data-theme", theme);
      } catch (_e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260318g">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 2rem;
    }
    .login-card h2 {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    #login-error {
      display: none;
    }
    #not-authorized {
      display: none;
    }
    #code-group {
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <h2>Stigamo</h2>

      <div id="login-form-wrapper">
        <div class="mb-3">
          <label for="identifier" class="form-label">E-post eller användarnamn</label>
          <input type="text" class="form-control" id="identifier" autocomplete="username" autofocus
                 style="background:var(--input-bg);color:var(--input-text);border-color:var(--input-border);">
        </div>

        <div class="mb-3" id="code-group">
          <label for="code-input" class="form-label">Kod</label>
          <input type="password" class="form-control" id="code-input" autocomplete="off"
                 style="background:var(--input-bg);color:var(--input-text);border-color:var(--input-border);">
        </div>

        <div class="alert alert-danger py-2" id="login-error"></div>

        <button class="btn btn-primary w-100" id="login-btn" onclick="doLogin()">Logga in</button>
      </div>

      <div id="not-authorized" class="text-center">
        <h4 class="mt-3 mb-3">not so fast</h4>
        <p class="text-muted">Ditt konto finns inte med i någon behörighetslista. Kontakta en administratör för att få åtkomst.</p>
        <button class="btn btn-outline-secondary btn-sm mt-2" onclick="showLoginForm()">Tillbaka</button>
      </div>
    </div>
  </div>

  <script>
    const API = (() => {
      if (window.location.protocol === "http:" || window.location.protocol === "https:") return "";
      return "http://localhost:8000";
    })();

    // Om redan inloggad, redirect
    (function () {
      const token = localStorage.getItem("allok_auth_token");
      if (token) {
        fetch(`${API}/api/auth/me`, { headers: { "Authorization": `Bearer ${token}` } })
          .then(r => { if (r.ok) window.location.href = "/"; })
          .catch(() => {});
      }
    })();

    const identEl = document.getElementById("identifier");
    const codeGroup = document.getElementById("code-group");
    const codeEl = document.getElementById("code-input");
    const errEl = document.getElementById("login-error");
    const notAuthEl = document.getElementById("not-authorized");
    const formEl = document.getElementById("login-form-wrapper");

    // Enter-tangent
    identEl.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
    codeEl.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

    async function doLogin() {
      errEl.style.display = "none";
      const ident = identEl.value.trim();
      if (!ident) { showError("Ange e-post eller användarnamn"); return; }

      const payload = { identifier: ident };
      if (codeGroup.style.display !== "none") {
        payload.code = codeEl.value;
      }

      try {
        const resp = await fetch(`${API}/api/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await resp.json();

        if (!resp.ok) {
          showError(data.detail || "Inloggningsfel");
          return;
        }

        if (data.needs_code) {
          codeGroup.style.display = "block";
          codeEl.focus();
          return;
        }

        if (data.not_authorized) {
          formEl.style.display = "none";
          notAuthEl.style.display = "block";
          return;
        }

        // Lyckad inloggning
        localStorage.setItem("allok_auth_token", data.token);
        localStorage.setItem("allok_user", JSON.stringify(data));
        window.location.href = "/";
      } catch (err) {
        showError("Kunde inte nå servern");
      }
    }

    function showError(msg) {
      errEl.textContent = msg;
      errEl.style.display = "block";
    }

    function showLoginForm() {
      notAuthEl.style.display = "none";
      formEl.style.display = "block";
      codeGroup.style.display = "none";
      codeEl.value = "";
      identEl.value = "";
      identEl.focus();
    }
  </script>
</body>
</html>
