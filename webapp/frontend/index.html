<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Allokering</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container-fluid p-3">
  <div class="row g-3">

    <!-- Vanster: Indatafiler + Prognos/Kampanj + Filter -->
    <div class="col-auto">

      <!-- Indatafiler -->
      <div class="card mb-2">
        <div class="card-header fw-bold">Indatafiler</div>
        <div class="card-body py-2" id="file-rows">
          <!-- Genereras av app.js -->
        </div>
      </div>

      <!-- Prognos / Kampanj -->
      <div class="card mb-2">
        <div class="card-header fw-bold">Prognos / Kampanj</div>
        <div class="card-body py-2" id="prog-rows">
          <!-- Genereras av app.js -->
        </div>
      </div>

      <!-- Filter (dolt tills filer laddas upp) -->
      <div class="card mb-2" id="filter-card" style="display:none">
        <div class="card-header fw-bold">Filtrering</div>
        <div class="card-body py-2" id="filter-content">
          <!-- Genereras av app.js -->
        </div>
      </div>

    </div>

    <!-- Mitten: DEMO (WMS / Eftersok) -->
    <div class="col-auto">
      <div class="card mb-2">
        <div class="card-header">
          <span class="text-success fw-bold">DEMO</span>
        </div>
        <div class="card-body py-2">
          <div class="mb-2">
            <label class="form-label mb-1">Inkopsnummer</label>
            <input type="text" class="form-control form-control-sm" id="purchase-input" placeholder="ex. 12345">
          </div>
          <div class="mb-2">
            <label class="form-label mb-1">Artikelnummer</label>
            <input type="text" class="form-control form-control-sm" id="article-input" placeholder="ex. 1234567">
          </div>
          <div id="wms-file-rows">
            <!-- WMS-filer genereras av app.js -->
          </div>
        </div>
      </div>
    </div>

    <!-- Hoger: Klistra in varden -->
    <div class="col-auto">
      <div class="card mb-2">
        <div class="card-header fw-bold">Dela</div>
        <div class="card-body py-2">
          <label class="form-label mb-1">Varden (en per rad):</label>
          <textarea class="form-control form-control-sm" id="paste-values" rows="10"
                    placeholder="Klistra in dina varden har..."></textarea>
          <div class="d-flex align-items-center mt-2 gap-2 flex-wrap">
            <label class="mb-0 text-nowrap">Antal per kolumn:</label>
            <input type="number" class="form-control form-control-sm" style="width:90px"
                   id="chunk-size" value="2000" min="1">
            <button class="btn btn-secondary btn-sm" onclick="openChunkedExcel()">
              Oppna i Excel direkt
            </button>
          </div>
          <div class="d-flex gap-1 flex-wrap mt-2" id="chunk-col-buttons" style="display:none!important"></div>
        </div>
      </div>
    </div>

  </div><!-- /row -->

  <!-- Kor-knappar -->
  <div class="d-flex gap-2 flex-wrap mb-1 mt-1">
    <button class="btn btn-primary btn-sm" id="btn-allokering" onclick="runJob('allokering')">
      Kor allokering
    </button>
    <button class="btn btn-primary btn-sm" id="btn-hib-koppling" onclick="runJob('hib-koppling')">
      Kor HIB-koppling
    </button>
    <button class="btn btn-primary btn-sm" id="btn-orderkontroll" onclick="runJob('orderkontroll')">
      Kontrollera orderoversikt
    </button>
    <button class="btn btn-primary btn-sm" id="btn-dispatchkontroll" onclick="runJob('dispatchkontroll')">
      Kontrollera dispatchpallar
    </button>
    <button class="btn btn-primary btn-sm" id="btn-eftersok" onclick="runJob('eftersok')">
      Eftersok
    </button>
  </div>

  <!-- Kopiera-knappar (gula) + Rensa cache -->
  <div class="d-flex gap-2 flex-wrap mb-2">
    <button class="btn btn-warning btn-sm" id="btn-kompletta" onclick="copyList('list1')">
      Kompletta ordrar
    </button>
    <button class="btn btn-warning btn-sm" id="btn-pafyllning" onclick="copyList('list2')">
      Pafyllningsbehov
    </button>
    <button class="btn btn-outline-secondary btn-sm ms-3" onclick="resetCache()">
      Rensa cache
    </button>
  </div>

  <!-- Oppna resultat-knappar (aktiveras dynamiskt) -->
  <div class="d-flex gap-2 flex-wrap mb-2" id="result-buttons">
    <!-- Genereras av app.js efter korning -->
  </div>

  <!-- Loggruta -->
  <pre id="log-output" class="bg-dark text-light p-2 mb-0"
       style="height:220px;overflow-y:auto;font-size:12px;border-radius:4px;"></pre>

</div><!-- /container -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
